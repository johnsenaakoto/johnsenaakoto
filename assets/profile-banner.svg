<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
  <title id="title">John Sena Akoto</title>
  <desc id="description">Software engineer building AI infrastructure, distributed systems, and GPU platforms.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.48" stop-color="#172554"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#93c5fd" stroke-opacity=".08"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#background)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>
  <circle cx="1030" cy="40" r="180" fill="#7c3aed" opacity=".12"/>
  <circle cx="1130" cy="260" r="150" fill="#06b6d4" opacity=".1"/>

  <g transform="translate(875 70)" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M25 90H95M145 40l-50 50m50 50L95 90m50-50h70m-70 100h70m0-100 50 50-50 50" opacity=".75"/>
    <g fill="#172554" filter="url(#glow)">
      <rect x="0" y="65" width="50" height="50" rx="12"/>
      <rect x="120" y="15" width="50" height="50" rx="12"/>
      <rect x="120" y="115" width="50" height="50" rx="12"/>
      <rect x="240" y="65" width="50" height="50" rx="12"/>
    </g>
    <g fill="#67e8f9" stroke="none">
      <circle cx="25" cy="90" r="6"/><circle cx="145" cy="40" r="6"/>
      <circle cx="145" cy="140" r="6"/><circle cx="265" cy="90" r="6"/>
    </g>
  </g>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="72" y="112" fill="#ffffff" font-size="52" font-weight="700">John Sena Akoto</text>
    <rect x="72" y="136" width="560" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="72" y="188" fill="#c7d2fe" font-size="25" font-weight="500">Software Engineer · AI Infrastructure</text>
    <text x="72" y="226" fill="#a5f3fc" font-size="22">Distributed systems  •  GPU platforms  •  Cloud</text>
    <text x="72" y="274" fill="#94a3b8" font-size="16" letter-spacing="2">BUILD  •  AUTOMATE  •  SCALE</text>
  </g>
</svg>
